name: FlyDrone tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONWARNINGS: ignore::RuntimeWarning

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pytest -q

  benchmark:
    name: Full benchmark + robustness
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run held-out benchmark
        working-directory: prototype/2d
        run: python benchmark.py | tee benchmark.log
      - name: Run noise/latency stress test
        working-directory: prototype/2d
        run: python stress_test.py | tee stress.log
      - name: Publish benchmark tables to Actions summary
        run: python scripts/render_action_summary.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: flydrone-benchmark-${{ github.run_number }}
          path: |
            prototype/2d/results.csv
            prototype/2d/summary.json
            prototype/2d/stress_summary.json
            prototype/2d/success_rates.png
            prototype/2d/demo_trajectories.png
            prototype/2d/stress_success.png
            prototype/2d/benchmark.log
            prototype/2d/stress.log


  benchmark3d:
    name: Phase 2 — 3D benchmark + robustness
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run 3D held-out benchmark
        working-directory: prototype/3d
        run: python benchmark3d.py | tee benchmark3d.log
      - name: Run 3D noise/latency stress test
        working-directory: prototype/3d
        run: python stress3d.py | tee stress3d.log
      - name: Publish 3D tables to Actions summary
        run: python scripts/render_3d_summary.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: flydrone-3d-${{ github.run_number }}
          path: |
            prototype/3d/results3d.csv
            prototype/3d/summary3d.json
            prototype/3d/stress_summary3d.json
            prototype/3d/success_rates_3d.png
            prototype/3d/demo_trajectories_3d.png
            prototype/3d/stress_success_3d.png
            prototype/3d/benchmark3d.log
            prototype/3d/stress3d.log
  benchmark6dof:
    name: Phase 3 — 6-DoF rigid-body + robustness
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run 6-DoF held-out benchmark
        working-directory: prototype/3d
        run: python benchmark6dof.py | tee benchmark6dof.log
      - name: Run 6-DoF robustness suite
        working-directory: prototype/3d
        run: python stress6dof.py | tee stress6dof.log
      - name: Publish 6-DoF tables to Actions summary
        run: python scripts/render_6dof_summary.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: flydrone-6dof-${{ github.run_number }}
          path: |
            prototype/3d/results6dof.csv
            prototype/3d/summary6dof.json
            prototype/3d/stress_summary6dof.json
            prototype/3d/success_rates_6dof.png
            prototype/3d/demo_trajectories_6dof.png
            prototype/3d/stress_success_6dof.png
            prototype/3d/benchmark6dof.log
            prototype/3d/stress6dof.log
  learned_sparse_smoke:
    name: v0.2 — learned sparse checkpoint smoke
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install "numpy>=2,<3"
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Load checkpoint and run 24-node forward pass
        run: python scripts/smoke_learned_sparse.py
