name: Phase 4 MAVLink Obstacle Bridge Diagnostic (WIP)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  obstacle-bridge-diagnostic:
    name: Gazebo lidar → MAVLink obstacle bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MAVLink client
        run: python -m pip install pymavlink
      - name: Start PX4 x500 2D lidar
        run: |
          docker pull px4io/px4-sitl-gazebo:latest
          docker run --rm -d \
            --name flydrone-px4-obstacle \
            --network host \
            -e HEADLESS=1 \
            -e PX4_SIM_MODEL=gz_x500_lidar_2d \
            -v "$GITHUB_WORKSPACE/phase4/lidar:/flydrone:ro" \
            px4io/px4-sitl-gazebo:latest
          sleep 8
      - name: Spawn physical wall
        run: |
          docker exec flydrone-px4-obstacle bash -lc \
            'gz service -s /world/default/create \
              --reqtype gz.msgs.EntityFactory \
              --reptype gz.msgs.Boolean \
              --timeout 5000 \
              --req '\''sdf_filename: "/flydrone/obstacle_wall.sdf", name: "flydrone_wall"'\''' \
            | tee phase4/lidar/spawn_wall.log
          sleep 2

      - name: Require MAVLink obstacle-distance stream
        run: |
          set -o pipefail
          python phase4/lidar/check_obstacle_distance.py \
            | tee phase4/lidar/obstacle_distance.log

      - name: Collect diagnostic logs
        if: always()
        run: |
          docker logs flydrone-px4-obstacle \
            > phase4/lidar/obstacle_container.log 2>&1 || true
          echo '## MAVLink obstacle-bridge diagnostic' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'This job passes only when an `OBSTACLE_DISTANCE` stream is observed.' \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat phase4/lidar/mavlink_obstacle_distance.json \
            >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          docker stop flydrone-px4-obstacle || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flydrone-obstacle-bridge-${{ github.run_number }}
          path: phase4/lidar/
          if-no-files-found: warn
